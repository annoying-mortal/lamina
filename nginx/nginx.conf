worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    map $uri $file_disposition {
        default attachment;
        ~*\.(png|jpe?g|gif|webp|svg|ico|avif)$ "";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Only submissions are public; no CMS read, login, or management routes.
        location = /api/friend-applications {
            if ($request_uri != /api/friend-applications) { return 404; }
            if ($request_method != POST) { return 405; }
            client_max_body_size 8k;
            client_body_timeout 15s;
            # Resolve at request time so static-only containers can still start,
            # and a replaced admin container does not leave a stale upstream IP.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $friend_application_backend http://admin:4322;
            proxy_pass $friend_application_backend/api/friend-applications;
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Location;
            proxy_hide_header WWW-Authenticate;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Each deployer supplies this original font; keep it outside shared images.
        location ^~ /fonts/alimama-fangyuan/ {
            alias /var/www/site-fonts/alimama-fangyuan/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
        }

        # The existing blog-uploads volume now serves both URL prefixes.
        location /static/ {
            alias /var/www/static/;
            autoindex off;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition $file_disposition always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
        location /uploads/ {
            alias /var/www/static/;
            autoindex off;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition $file_disposition always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
        location ~ /\. {
            deny all;
        }

        # Astro's fingerprinted resources can safely be cached long term.
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
