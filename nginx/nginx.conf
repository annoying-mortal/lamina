worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Each deployer supplies this original font; keep it outside shared images.
        location ^~ /fonts/alimama-fangyuan/ {
            alias /var/www/site-fonts/alimama-fangyuan/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
        }

        # Uploads live in their own persistent volume, across site releases.
        location /uploads/ {
            alias /var/www/uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
        location ~ /\. {
            deny all;
        }

        # Astro's fingerprinted resources can safely be cached long term.
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
